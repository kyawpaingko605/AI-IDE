name: Setup and Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ၁။ Java Environment အား သတ်မှတ်ခြင်း
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ၂။ ရှိပြီးသား Binaries များကို Setup လုပ်ခြင်း
      - name: Verify and Setup Existing Binaries
        run: |
          mkdir -p app/src/main/assets/bin_tools
          cd app/src/main/assets/bin_tools/
          chmod +x aapt2 d8 apksigner || true

      # ၃။ Gradle မောင်းနှင်ရန် Permission ပေးခြင်း
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ၄။ APK အား အမှန်တကယ် Build ထုတ်ခြင်း
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # ၅။ ထွက်လာသော APK အား Actions ထဲတွင် ဒေါင်းလုဒ်ဆွဲနိုင်ရန် တင်ပေးခြင်း (Artifact)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-IDE-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
