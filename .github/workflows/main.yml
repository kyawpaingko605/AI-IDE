name: Setup and Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ၁။ Java Environment အား သတ်မှတ်ခြင်း
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ၂။ ရှိပြီးသား Binaries များကို Setup လုပ်ခြင်း
      - name: Verify and Setup Existing Binaries
        run: |
          mkdir -p app/src/main/assets/bin_tools
          cd app/src/main/assets/bin_tools/
          chmod +x aapt2 d8 apksigner || true

      # ၃။ Project ထဲက gradlew ရှိတဲ့နေရာကို ရှာပြီး Permission ပေးခြင်း
      - name: Grant execute permission for gradlew
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found in your project!"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      # ၄။ သက်ဆိုင်ရာ Folder ထဲဝင်ပြီး APK ကို Build ထုတ်ခြင်း
      - name: Build with Gradle
        run: |
          cd ${{ env.GRADLEW_DIR }}
          ./gradlew assembleDebug

      # ၅။ ထွက်လာသော APK အား တင်ပေးခြင်း
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-IDE-Debug-APK
          path: "**/build/outputs/apk/debug/*-debug.apk"
