name: Setup Binaries
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify and Setup Existing Binaries
        run: |
          # ရှိပြီးသား ဖိုင်များကို assets/bin_tools အောက်သို့ နေရာချခြင်းနှင့် ဆောက်ခြင်း
          mkdir -p app/src/main/assets/bin_tools
          
          cd app/src/main/assets/bin_tools/
          
          # ဖိုင်များကို စက်ကနေ ပတ်မောင်းလို့ရအောင် အမိန့်ပေး Permission သတ်မှတ်ခြင်း
          chmod +x aapt2 d8 apksigner || true

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix: Existing Binaries Verified and Permissions Set"
