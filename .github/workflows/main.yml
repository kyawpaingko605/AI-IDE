name: Setup and Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ၁။ Java JDK 17 ကို အဆင်သင့်ပြင်ဆင်ခြင်း
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ၂။ သင့်ဆီမှာ ရှိပြီးသား Binaries များကို Setup လုပ်ခြင်း
      - name: Verify and Setup Existing Binaries
        run: |
          mkdir -p app/src/main/assets/bin_tools
          cd app/src/main/assets/bin_tools/
          chmod +x aapt2 d8 apksigner || true

      # ၃။ gradlew ဖိုင်မရှိပါက ရှိပြီးသား properties ကိုသုံးပြီး အော်တိုဆောက်ခိုင်းခြင်း
      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew missing! Generating wrapper from existing configuration..."
            gradle wrapper
          fi
          chmod +x gradlew

      # ၄။ APK အား အောင်မြင်အောင် Build ထုတ်ခြင်း
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # ၅။ ထွက်လာသော APK ဖိုင်အား Actions ထဲတွင် ဒေါင်းလုဒ်ဆွဲနိုင်ရန် တင်ပေးခြင်း
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-IDE-Debug-APK
          path: "**/build/outputs/apk/debug/*-debug.apk"
