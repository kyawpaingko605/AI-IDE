name: Setup and Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ၁။ Java JDK 17 ကို သတ်မှတ်ခြင်း
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ၂။ ရှိပြီးသား Binaries များကို Setup လုပ်ခြင်း
      - name: Verify and Setup Existing Binaries
        run: |
          mkdir -p app/src/main/assets/bin_tools
          cd app/src/main/assets/bin_tools/
          chmod +x aapt2 d8 apksigner || true

      # ၃။ gradlew ဖိုင်မရှိပါက အော်တိုဆောက်ခြင်း
      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew missing! Generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      # ၄။ ပိုမိုတည်ငြိမ်ပြီး အဆင်ပြေမည့် Gradle Version 8.2 ကို ပြောင်းလဲသတ်မှတ်ခြင်း
      - name: Downgrade Gradle Version for Compatibility
        run: |
          ./gradlew wrapper --gradle-version 8.2 --distribution-type bin

      # ၅။ APK အား အောင်မြင်အောင် Build ထုတ်ခြင်း
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # ၆။ ထွက်လာသော APK ဖိုင်အား တင်ပေးခြင်း
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-IDE-Debug-APK
          path: "**/build/outputs/apk/debug/*-debug.apk"
